name: Update stations data

on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов
  workflow_dispatch:        # Ручной запуск

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Явно указываем использовать Node.js 20 (пока поддерживается)
          # После 16 июня 2026 года можно будет убрать эту строку
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download stations data
        run: |
          # Добавляем повторные попытки и таймаут
          for i in {1..3}; do
            echo "Попытка $i скачать данные..."
            if curl -f -o stations.json --connect-timeout 30 --max-time 60 "https://alfabank.ru/api/v1/azs-stations/public/stations"; then
              echo "Скачивание успешно"
              break
            else
              echo "Ошибка скачивания, повтор через 5 секунд..."
              sleep 5
            fi
          done

      - name: Check if file changed
        id: check
        run: |
          if git diff --quiet stations.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -m "Автоматическое обновление данных АЗС [skip ci]"
          git push
