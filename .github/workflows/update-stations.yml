name: Update stations data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download stations data
        run: |
          echo "Начинаем загрузку данных с API Альфа-Банка..."
          if curl -k -f -o stations.json \
             -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
             -H "Accept: application/json, text/plain, */*" \
             -H "Accept-Language: ru-RU,ru;q=0.9,en-US;q=0.8,en;q=0.7" \
             -H "Referer: https://alfabank.ru/" \
             -H "Cache-Control: no-cache" \
             --compressed \
             --connect-timeout 30 \
             --max-time 60 \
             "https://alfabank.ru/api/v1/azs-stations/public/stations"; then
            echo "✅ Данные успешно загружены"
            if head -c 1 stations.json | grep -q '['; then
              echo "✅ JSON валидный"
            else
              echo "❌ Файл не содержит валидный JSON"
              echo "Содержимое файла (первые 200 символов):"
              head -c 200 stations.json
              exit 1
            fi
          else
            echo "❌ Ошибка загрузки данных"
            exit 1
          fi

      - name: Check if file changed
        id: check
        run: |
          if git diff --quiet stations.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📊 Данные не изменились"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📊 Данные изменились, будет создан коммит"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -m "Автоматическое обновление данных АЗС [skip ci]"
          git push
          echo "✅ Изменения отправлены в репозиторий"
