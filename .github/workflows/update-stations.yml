name: Update stations data

on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов
  workflow_dispatch:        # Ручной запуск

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download stations data
        run: |
          echo "Начинаем загрузку данных с API Альфа-Банка через прокси..."
          
          # Используем публичный прокси-сервер для обхода блокировки
          PROXY_URL="https://asz-availability.piter-key.workers.dev"
          
          if curl -f -o stations.json \
             --connect-timeout 30 \
             --max-time 60 \
             "$PROXY_URL"; then
            echo "✅ Данные успешно загружены через прокси"
            
            # Проверяем, что файл содержит валидный JSON
            if head -c 1 stations.json | grep -q '['; then
              echo "✅ JSON валидный"
            else
              echo "❌ Файл не содержит валидный JSON"
              exit 1
            fi
          else
            echo "❌ Ошибка загрузки данных через прокси"
            exit 1
          fi

      - name: Check if file changed
        id: check
        run: |
          if git diff --quiet stations.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📊 Данные не изменились"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📊 Данные изменились, будет создан коммит"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -m "Автоматическое обновление данных АЗС [skip ci]"
          git push
          echo "✅ Изменения отправлены в репозиторий"
