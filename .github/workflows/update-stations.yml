name: Update stations data

on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов
  workflow_dispatch:        # Возможность запуска вручную

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download stations data
        run: |
          curl -o stations.json https://alfabank.ru/api/v1/azs-stations/public/stations

      - name: Check if file changed
        id: check
        run: |
          if git diff --quiet stations.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -m "Автоматическое обновление данных АЗС [skip ci]"
          git push
